[project]
name = "lucy-frankenstein"
version = "6.0.0"
description = "Assistente pessoal Jarvis-like 100% local e privado"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Capitão Marcelo", email = "mgabrial72-art@users.noreply.github.com"}
]
license = {text = "Proprietary"}

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["api", "config"]

[tool.coverage.run]
source = ["api", "config"]
omit = ["tests/*", "venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:"
]
