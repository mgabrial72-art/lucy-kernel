name: Lucy CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint (erros críticos apenas)
        run: ruff check api/ config/ --select E9,F --no-cache

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar sintaxe de todos os arquivos
        run: |
          python -m py_compile api/main.py
          python -m py_compile api/routes/*.py
          python -m py_compile api/services/*.py
          python -m py_compile config/*.py
          echo "Sintaxe OK"

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio httpx fastapi pydantic pydantic-settings loguru slowapi aiosqlite pytz requests

      - name: Run unit tests (sem Ollama)
        run: pytest tests/test_cache.py::test_ttl_cache_basic -v
